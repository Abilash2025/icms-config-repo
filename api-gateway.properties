server.port=8080

eureka.client.service-url.defaultZone = http://localhost:8761/eureka

eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/customers/**

spring.cloud.gateway.server.webflux.routes[1].id=policy-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://POLICY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/policy/**

spring.cloud.gateway.server.webflux.routes[2].id=claim-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CLAIM-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/claims/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true