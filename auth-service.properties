server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/icms_authdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

#JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

#Eureka
eureka.client.service-url.defaultZone = ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

#Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
refresh-token-expiration=604800000

#RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

#Admin Bootstrapping
icms.bootstrap-admin.enabled=${ICMS_BOOTSTRAP_ADMIN_ENABLED:false}
icms.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
icms.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

#Debugging
logging.level.org.springframework.security=DEBUG